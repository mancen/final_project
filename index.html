	<!-- 遮罩使用 -->
	<div class="mask"></div>

    <!-- 頁首區域 -->
	<header class="bg-primary-50 z-1 sticky-top">
		<nav>
			<div class="container">
				<div class="d-flex py-12  align-items-center">
					<!-- 網站logo -->
					<a class="logo" href="#">
					<picture>
						<source srcset="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/456698ad0b642710162489555e98fd3b15eb49ff/2026-web-camp/device-mobile.svg" media="(max-width: 575px)" />
						<img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/456698ad0b642710162489555e98fd3b15eb49ff/2026-web-camp/device-pc.svg" alt="" />
					</picture>
					</a>
					<!-- 手機版(漢堡按鈕) -->
					<button class="menu-button d-none d-md-block ml-auto p-12" type="button">
						<span class="material-symbols-outlined">dehaze</span>
					</button>
						<!-- nav(選單) -->
						<ul class="nav-list label-mobile-sm d-md-none ml-auto d-flex label-md text-neutral-700 gap-24">
							<li class="w-md-full"><a class="d-block px-12 py-4" href="#">服務項目</a></li>
							<li class="w-md-full"><a class="d-block px-12 py-4" href="#">專案作品</a></li>
							<li class="w-md-full"><a class="d-block px-12 py-4" href="#">部落格</a></li>
							<li class="w-md-full"><a class="d-block px-12 py-4" href="#">與我聯絡</a></li>
						</ul>
				</div>
			</div>
			
		</nav>
	</header>

	<!-- hero區域 -->
	<section class="hero bg-primary-50">
		<div class="container h-full">
			<div class="d-flex text-neutral-700 flex-md-col">
				<div class="col-5 m-auto col-md-12 order-md-2  py-md-24">
					<!-- 標題 -->
					<h1 class="mb-24 heading-xxxl heading-mobile-xl mb-md-12">
						<span class="d-block">Hello</span>
						<span class="d-block">I’m Nelson</span>
					</h1>

					<!-- 內文 -->
					<p class="paragraph-md mb-4 paragraph-mobile-sm">我是一個擁有 10 年經驗的 UIUX 設計師 和 前端工程師</p>
					<p class="paragraph-md mb-60 paragraph-mobile-sm mb-md-32">喜歡把美學和程式結合，打造一個又一個精美的網頁設計！</p>

					<div class="label-md label-mobile-sm">
						<button class="py-12 px-24 text-neutral-0 bg-neutral-700 rounded-full mr-24" type="button">與我聯絡</button>
						<button class="py-12 px-24 btn-outline rounded-full" type="button">我的履歷</button>
					</div>
			</div>

			<div class="col-7 col-md-12 order-md-1 min-h-0 h-full">
				<!-- 圖片 -->
				<img class="object-fit-cover" src="https://github.com/hexschool/2022-web-layout-training/blob/main/2026-web-camp/index_person.png?raw=true" alt="hero image">
			</div>
			</div>
		</div>
	</section>

	<!-- 頁尾區域 -->
	<footer class="bg-primary-900 text-neutral-0 py-80">
		<div class="container">
			<div class="d-flex flex-wrap">
				<!-- 聯絡資訊區塊 -->
				<div class="col-5 col-md-12">
					<!-- 標題 -->
						<h2 class="mb-24">
							<span class="d-block heading-xxxs ">與我聯絡</span>
							<span class="d-block heading-xxxl">contact</span>
						</h2>
						<!-- 內文 -->
						<p class="paragraph-md mb-4">若有數位產品設計和開發相關問題</p>
						<p class="paragraph-md mb-92">歡迎填寫表單 或 直接與我聯絡！</p>

						<!-- pc版本 -->
						<div class="d-block d-md-none">
							<!-- social icon -->
							<div class="d-flex mb-24 gap-12">
								<a href="#" class="p-12 rounded-full btn-outline line-height-1">
									<i class="bi bi-instagram text-24"></i>
								</a>
								<a href="#" class="p-12 rounded-full btn-outline line-height-1">
									<i class="bi bi-line text-24"></i>
								</a>
								<a href="#" class="p-12 rounded-full btn-outline line-height-1">
									<i class="bi bi-linkedin text-24"></i>
								</a>
							</div>
							<!-- 信箱資訊 -->
							<a href="mailto:service@hexschool.com" class="d-flex gap-8">
								<span class="material-symbols-outlined text-24">drafts</span>
								<p class="paragraph-md">service@hexschool.com</p>
							</a>
						</div>
				</div>
			
				<!-- 聯絡表格區塊 -->
				<div class="col-7 col-md-12">
					<form class="d-flex flex-wrap gap-24 px-40 paragraph-md">
						<input class="btn-outline rounded-40 contact-input-half px-32 py-20" type="text" placeholder="姓名">
						<input class="btn-outline rounded-40 contact-input-half px-32 py-20" type="tel" placeholder="電話">
						<input class="btn-outline rounded-40 w-full px-32 py-20" type="email" placeholder="電子信箱">	
						<textarea class="btn-outline rounded-40 w-full px-32 py-20" rows="4" placeholder="備註"></textarea>	
						<button class="label-md bg-neutral-0 text-neutral-700 py-12 w-full text-center rounded-full" type="submit">送出</button>
					</form>
				</div>

				<!-- mobile版本 -->
				<div class="d-none d-md-block">
					<!-- social icon -->
						<div class="d-flex mb-24 gap-12">
							<a href="#" class="p-12 rounded-full btn-outline">
								<i class="bi bi-instagram text-24 line-height-1"></i>
							</a>
							<a href="#" class="p-12 rounded-full btn-outline">
								<i class="bi bi-line text-24 line-height-1"></i>
							</a>
							<a href="#" class="p-12 rounded-full btn-outline">
								<i class="bi bi-linkedin text-24 line-height-1"></i>
							</a>
						</div>
						<!-- 信箱資訊 -->
						<a href="mailto:service@hexschool.com" class="d-flex gap-8">
							<span class="material-symbols-outlined text-24">drafts</span>
							<p class="paragraph-md">service@hexschool.com</p>
						</a>
				</div>
		</div>
	</div>
			

	</footer>
